substitutions:
  name: pico-nutrispin
  friendly_name: NutriSpin Feeders

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1

rp2:
  board: rpipicow

external_components:
  - source:
      type: local
      path: components
    components: [nutrispin]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: ha_clock
    timezone: Europe/Warsaw
    update_interval: 30min

rp2_ble_tracker:
  scan_parameters:
    active: true
    interval: 100ms
    window: 30ms

nutrispin:
  - id: feeder_1
    name: "Feeder 1"
    time_id: ha_clock
    credentials: !secret feeder_1
    poll_interval: 60s
    clock_sync_interval: 30min
  - id: feeder_2
    name: "Feeder 2"
    time_id: ha_clock
    credentials: !secret feeder_2
    poll_interval: 60s
    clock_sync_interval: 30min

button:
  - platform: restart
    name: "Restart Pico"
    entity_category: diagnostic

sensor:
  - platform: uptime
    name: "Pico Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "Pico Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic
